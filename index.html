<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Fantasy R.H.</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --green-dim: #1a4a24;
    --red: #f85149; --red-dim: #4a1a1a;
    --amber: #d29922; --amber-dim: #3d2a00;
    --blue: #58a6ff; --blue-dim: #1a2d4a;
    --purple: #bc8cff; --purple-dim: #2d1a4a;
    --radius: 10px; --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  body { display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 17px; font-weight: 600; }
  .logo span { color: var(--green); }
  .updated { font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 0 0 calc(var(--nav-h) + 16px); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; z-index: 100; }
  nav button { flex: 1; background: none; border: none; color: var(--muted); font-size: 10px; padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color .15s; }
  nav button.active { color: var(--green); }
  nav button svg { width: 22px; height: 22px; }
  .section { display: none; padding: 16px; }
  .section.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  .today-header { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .action-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: var(--radius); margin-bottom: 8px; }
  .action-item.buy { background: var(--green-dim); border: 1px solid #2ea04326; }
  .action-item.sell { background: var(--red-dim); border: 1px solid #f8514926; }
  .action-item.warn { background: var(--amber-dim); border: 1px solid #d2992226; }
  .action-item.info { background: var(--blue-dim); border: 1px solid #58a6ff26; }
  .action-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .action-body { flex: 1; min-width: 0; }
  .action-title { font-weight: 600; font-size: 14px; }
  .action-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .action-price { font-size: 13px; color: var(--green); font-weight: 600; margin-top: 3px; }
  .player-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .player-row:last-child { border-bottom: none; }
  .player-img-placeholder { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .player-info { flex: 1; min-width: 0; }
  .player-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .player-right { text-align: right; flex-shrink: 0; }
  .player-value { font-size: 14px; font-weight: 600; }
  .player-pts { font-size: 12px; color: var(--muted); }
  .score-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 4px; }
  .score-high { background: var(--green-dim); color: var(--green); }
  .score-mid { background: var(--amber-dim); color: var(--amber); }
  .score-low { background: var(--red-dim); color: var(--red); }
  .risk { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .risk-BAJO { background: var(--green-dim); color: var(--green); }
  .risk-MEDIO { background: var(--amber-dim); color: var(--amber); }
  .risk-ALTO { background: var(--red-dim); color: var(--red); }
  .risk-CRÍTICO { background: #5a0000; color: #ff6b6b; }
  /* Tipo de mercado */
  .type-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
  .type-subasta { background: var(--blue-dim); color: var(--blue); }
  .type-clausulazo { background: var(--purple-dim); color: var(--purple); }
  /* Tendencia */
  .trend-up { color: var(--green); }
  .trend-down { color: var(--red); }
  .trend-stable { color: var(--muted); }
  .potential-ALTO { color: var(--green); font-weight: 700; }
  .potential-MEDIO { color: var(--amber); font-weight: 600; }
  .potential-BAJO { color: var(--muted); }
  /* Tabs dentro de sección */
  .tab-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
  .tab-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .reasons { list-style: none; margin-top: 8px; }
  .reasons li { font-size: 12px; color: var(--muted); padding: 2px 0 2px 14px; position: relative; }
  .reasons li::before { content: "·"; position: absolute; left: 4px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  .error-box { background: var(--red-dim); border: 1px solid #f8514926; border-radius: var(--radius); padding: 14px; font-size: 13px; }
  .rival-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rival-row:last-child { border-bottom: none; }
  .rival-pos { width: 24px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .rival-name { flex: 1; font-weight: 600; font-size: 14px; }
  .rival-stats { text-align: right; font-size: 13px; }
  @media (min-width: 480px) { main { max-width: 480px; margin: 0 auto; } nav { max-width: 480px; left: 50%; transform: translateX(-50%); } }
</style>
</head>
<body>
<header>
  <div class="logo">Fantasy <span>R.H.</span></div>
  <div class="updated" id="last-updated">Cargando...</div>
</header>
<main>
  <!-- HOY -->
  <div class="section active" id="sec-hoy">
    <div style="padding:8px 0 8px">
      <div class="today-header">¿Qué hacer hoy?</div>
      <div id="gk-alert"></div>
      <div id="today-actions"><div class="loading">Cargando...</div></div>
    </div>
    <div class="summary-grid" id="summary-grid"></div>
  </div>
  <!-- MI EQUIPO -->
  <div class="section" id="sec-equipo">
    <div class="section-title">Mi equipo</div>
    <div id="team-list"><div class="loading">Cargando...</div></div>
  </div>
  <!-- MERCADO -->
  <div class="section" id="sec-mercado">
    <div class="section-title">Mercado</div>
    <div class="tab-bar">
      <div class="tab-btn active" onclick="switchMarketTab('subastas',this)">🏷️ Mercado</div>
      <div class="tab-btn" onclick="switchMarketTab('clausulazos',this)">🔒 Rivales</div>
    </div>
    <div id="market-subastas"></div>
    <div id="market-clausulazos" style="display:none"></div>
  </div>
  <!-- RIVALES -->
  <div class="section" id="sec-rivales">
    <div class="section-title">Rivales</div>
    <div id="rivals-list"><div class="loading">Cargando...</div></div>
  </div>
  <!-- OPORTUNIDADES -->
  <div class="section" id="sec-opor">
    <div class="section-title">Mejores oportunidades</div>
    <div id="opor-list"><div class="loading">Cargando...</div></div>
  </div>
</main>
<nav>
  <button class="active" onclick="showTab('hoy',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Hoy
  </button>
  <button onclick="showTab('equipo',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Mi equipo
  </button>
  <button onclick="showTab('mercado',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>Mercado
  </button>
  <button onclick="showTab('rivales',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Rivales
  </button>
  <button onclick="showTab('opor',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Opor.
  </button>
</nav>
<script>
const DATA = {};

function showTab(tab, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  btn.classList.add('active');
}

function switchMarketTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('market-subastas').style.display = tab === 'subastas' ? 'block' : 'none';
  document.getElementById('market-clausulazos').style.display = tab === 'clausulazos' ? 'block' : 'none';
}

async function loadJSON(file) {
  try {
    const r = await fetch('data/' + file + '?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) { return null; }
}

function fmt(n) {
  if (!n) return 'N/D';
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M€';
  return n + '€';
}

function scoreClass(s) { return s >= 65 ? 'score-high' : s >= 40 ? 'score-mid' : 'score-low'; }
function statusIcon(s) { return s === 'injured' ? ' 🤕' : s === 'doubtful' ? ' ❓' : s === 'out_of_league' ? ' ⛔' : ''; }
function posIcon(pid) { return ['','🧤','🛡️','⚙️','⚽'][pid] || '👤'; }

function trendHTML(trend) {
  if (!trend) return '';
  const arrow = trend.recent_trend === 'subiendo' ? '↑' : trend.recent_trend === 'bajando' ? '↓' : '→';
  const cls = trend.recent_trend === 'subiendo' ? 'trend-up' : trend.recent_trend === 'bajando' ? 'trend-down' : 'trend-stable';
  const recovery = trend.recovery_potential > 0 ? ` · <span class="potential-${trend.potential_label}">↑${trend.recovery_potential.toFixed(0)}% hasta máx temporada (${trend.max_value_fmt})</span>` : '';
  return `<span class="${cls}">${arrow} ${trend.trend_pct > 0 ? '+' : ''}${trend.trend_pct}% reciente</span>${recovery}`;
}

function typeBadge(type) {
  if (type === 'clausulazo') return '<span class="type-badge type-clausulazo">🔒 Clausulazo</span>';
  return '<span class="type-badge type-subasta">🏷️ Subasta</span>';
}

function renderSummary(report, team) {
  const g = document.getElementById('summary-grid');
  const s = report?.summary || {};
  g.innerHTML = `
    <div class="stat-box"><div class="stat-value" style="color:var(--green)">${s.team_value_fmt || fmt(team?.team_value) || 'N/D'}</div><div class="stat-label">Valor plantilla</div></div>
    <div class="stat-box"><div class="stat-value" style="color:var(--blue)">${s.budget_fmt || 'N/D'}</div><div class="stat-label">Presupuesto</div></div>
    <div class="stat-box"><div class="stat-value">${s.points || team?.team_points || 0}</div><div class="stat-label">Puntos</div></div>
    <div class="stat-box"><div class="stat-value" style="color:var(--blue)">${s.my_position ? s.my_position + 'º' : '?'}</div><div class="stat-label">Posición liga</div></div>`;
}

function renderTodayActions(report) {
  const el = document.getElementById('today-actions');
  const gkEl = document.getElementById('gk-alert');
  let html = '';

  if (report?.summary?.goalkeeper_risk === 'CRÍTICO' || report?.summary?.goalkeeper_risk === 'ALTO') {
    gkEl.innerHTML = `<div class="action-item warn" style="margin-bottom:8px"><div class="action-icon">🧤</div><div class="action-body"><div class="action-title">Atención porteros</div><div class="action-detail">${report.summary.goalkeeper_recommendation}</div></div></div>`;
  }

  (report?.top_buys || []).filter(b => b.position_id !== 5).forEach(b => {
    const typeLabel = b.market_type === 'clausulazo' ? '🔒 Clausulazo' : '🏷️ Subasta';
    const trendTxt = b.trend ? ` · Máx histórico: ${b.trend.max_value_fmt}` : '';
    html += `<div class="action-item buy"><div class="action-icon">🟢</div><div class="action-body">
      <div class="action-title">Comprar: ${b.nickname} <span style="font-size:11px;color:var(--muted)">${typeLabel}</span></div>
      <div class="action-detail">${b.position} · ${b.average_points} pts/j${statusIcon(b.status)}${trendTxt}</div>
      <div class="action-price">${b.market_type === 'clausulazo' ? 'Precio fijo: ' : 'Puja recom: '}${b.recommended_bid_fmt} · Máx: ${b.max_bid_fmt}</div>
      <div class="action-detail" style="margin-top:4px;font-size:11px">${b.strategy_note}</div>
    </div></div>`;
  });

  (report?.sell_recommendations || []).forEach(s => {
    html += `<div class="action-item sell"><div class="action-icon">🔴</div><div class="action-body">
      <div class="action-title">Vender: ${s.nickname}</div>
      <div class="action-detail">${s.position} · ${s.reasons[0] || ''}</div>
    </div></div>`;
  });

  (report?.clause_risks || []).filter(c => c.risk_level === 'ALTO' || c.risk_level === 'CRÍTICO').forEach(c => {
    html += `<div class="action-item warn"><div class="action-icon">🚨</div><div class="action-body">
      <div class="action-title">Riesgo clausulazo: ${c.nickname} <span class="risk risk-${c.risk_level}">${c.risk_level}</span></div>
      <div class="action-detail">${c.recommendation}</div>
    </div></div>`;
  });

  if (!html) html = `<div class="action-item info"><div class="action-icon">✅</div><div class="action-body"><div class="action-title">Sin acciones urgentes</div><div class="action-detail">Revisa el mercado para nuevas oportunidades</div></div></div>`;
  el.innerHTML = html;
}

function renderTeam(team) {
  const el = document.getElementById('team-list');
  if (!team?.players?.length) { el.innerHTML = '<div class="error-box">Sin datos de plantilla.</div>'; return; }
  const positions = ['Portero','Defensa','Centrocampista','Delantero'];
  let html = '';
  positions.forEach(pos => {
    const players = team.players.filter(p => p.position === pos);
    if (!players.length) return;
    html += `<div class="card"><div class="card-title">${pos}s</div>`;
    players.forEach(p => {
      const t = p.trend;
      html += `<div class="player-row">
        <div class="player-img-placeholder">${posIcon(p.position_id)}</div>
        <div class="player-info">
          <div class="player-name">${p.nickname}${statusIcon(p.status)}</div>
          <div class="player-meta">Cláusula: ${p.buyout_clause_fmt}</div>
          ${t ? `<div class="player-meta">${trendHTML(t)}</div>` : ''}
        </div>
        <div class="player-right">
          <div class="player-value">${p.market_value_fmt}</div>
          <div class="player-pts">${p.week_points ?? 0} / ${p.average_points} pts</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderMarketList(players, containerId, type) {
  const el = document.getElementById(containerId);
  // Filtrar entrenadores (position_id 5)
  const filtered = (players || []).filter(p => p.position_id !== 5);
  if (!filtered.length) {
    el.innerHTML = `<div class="card"><div style="color:var(--muted);text-align:center;padding:20px">Sin ${type} en este momento</div></div>`;
    return;
  }
  let html = `<div class="card"><div class="card-title">${filtered.length} jugadores</div>`;
  filtered.forEach(p => {
    const sc = p.score || 0;
    const t = p.trend;
    const isClause = p.market_type === 'clausulazo';
    const maxSeason = t?.max_value_fmt || '—';
    const compraLabel = isClause ? '🔒 Precio clausulazo' : '🏷️ Precio mercado';
    const compraValue = p.sale_price_fmt;
    const recLabel = isClause ? 'Precio fijo' : 'Puja recomendada';
    const recValue = isClause ? p.sale_price_fmt : p.recommended_bid_fmt;

    html += `<div class="player-row" style="align-items:flex-start;padding:14px 0">
      <div class="player-img-placeholder" style="margin-top:2px">${posIcon(p.position_id)}</div>
      <div class="player-info">
        <div class="player-name">${p.nickname}${statusIcon(p.status)} <span class="score-badge ${scoreClass(sc)}">${sc}</span></div>
        <div class="player-meta">${p.position}${p.seller ? ' · ' + p.seller : ''}</div>
        ${t ? `<div class="player-meta" style="margin-top:4px">${trendHTML(t)}</div>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px">
          <div style="background:var(--surface2);border-radius:6px;padding:6px 8px">
            <div style="font-size:10px;color:var(--muted)">Máx temporada</div>
            <div style="font-size:13px;font-weight:700;color:var(--amber)">${maxSeason}</div>
          </div>
          <div style="background:var(--surface2);border-radius:6px;padding:6px 8px">
            <div style="font-size:10px;color:var(--muted)">${compraLabel}</div>
            <div style="font-size:13px;font-weight:700">${compraValue}</div>
          </div>
          <div style="background:var(--surface2);border-radius:6px;padding:6px 8px">
            <div style="font-size:10px;color:var(--muted)">${recLabel}</div>
            <div style="font-size:13px;font-weight:700;color:var(--green)">${recValue}</div>
          </div>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderRivals(rivals) {
  const el = document.getElementById('rivals-list');
  if (!rivals?.rivals?.length) { el.innerHTML = '<div class="error-box">Sin datos de rivales.</div>'; return; }
  let html = '<div class="card">';
  rivals.rivals.forEach((r, i) => {
    html += `<div class="rival-row">
      <div class="rival-pos">${i+1}</div>
      <div class="rival-name">${r.manager}</div>
      <div class="rival-stats"><div style="font-weight:700">${r.points} pts</div><div style="font-size:12px;color:var(--muted)">${r.team_value_fmt}</div></div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderOpportunities(market) {
  const el = document.getElementById('opor-list');
  const all = (market?.players || []).filter(p => p.score >= 55 && p.position_id !== 5);
  if (!all.length) { el.innerHTML = '<div class="card"><div style="color:var(--muted);text-align:center;padding:20px">Sin oportunidades destacadas</div></div>'; return; }
  let html = '';
  all.slice(0, 8).forEach(p => {
    const sc = p.score || 0;
    const t = p.trend;
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <span style="font-weight:700;font-size:15px">${p.name}</span>
          <span class="score-badge ${scoreClass(sc)}">${sc}</span>
          ${typeBadge(p.market_type)}
        </div>
        <div style="font-size:12px;color:var(--muted)">${p.position}</div>
      </div>
      ${t ? `<div style="font-size:12px;margin-bottom:8px">${trendHTML(t)}</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div><div style="font-size:11px;color:var(--muted)">Precio venta</div><div style="font-weight:600">${p.sale_price_fmt}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Valor mercado</div><div style="font-weight:600;color:var(--green)">${p.market_value_fmt}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">${p.market_type === 'clausulazo' ? 'Precio fijo' : 'Puja recomendada'}</div><div style="font-weight:600;color:var(--blue)">${p.recommended_bid_fmt}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Puja máxima</div><div style="font-weight:600">${p.max_bid_fmt}</div></div>
      </div>
      <div style="font-size:11px;color:var(--amber);margin-bottom:6px">${p.strategy_note}</div>
      <ul class="reasons">${(p.reasons||[]).map(r=>'<li>'+r+'</li>').join('')}</ul>
    </div>`;
  });
  el.innerHTML = html;
}

async function init() {
  const [team, market, report, rivals] = await Promise.all([
    loadJSON('team.json'), loadJSON('market.json'),
    loadJSON('report.json'), loadJSON('rivals.json')
  ]);

  const ts = report?.generated_at || team?.updated_at || '';
  if (ts) {
    const d = new Date(ts);
    document.getElementById('last-updated').textContent = d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  }

  renderSummary(report, team);
  renderTodayActions(report);
  renderTeam(team);
  renderMarketList(market?.subastas, 'market-subastas', 'jugadores en el mercado');
  renderMarketList(market?.clausulazos, 'market-clausulazos', 'jugadores de rivales');
  renderRivals(rivals);
  renderOpportunities(market);
}

init();
setInterval(init, 5 * 60 * 1000);
</script>
</body>
</html>
