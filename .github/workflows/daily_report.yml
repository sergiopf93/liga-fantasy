name: Informe diario 20:00
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Generar informe
        env:
          LALIGA_TOKEN: ${{ secrets.LALIGA_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python scripts/generate_report.py
      - name: Commit
        run: |
          git config user.name "Fantasy Bot"
          git config user.email "bot@liga-fantasy"
          git add data/
          git diff --staged --quiet || git commit -m "Informe 20:00 - $(date '+%d/%m %H:%M')"
          git push
      - name: Preparar site
        run: |
          mkdir -p _site/data
          cp frontend/index.html _site/index.html
          for f in data/team.json data/market.json data/report.json data/rivals.json data/decisions.json; do
            [ -f "$f" ] && cp "$f" _site/data/ || echo "No existe: $f"
          done
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
