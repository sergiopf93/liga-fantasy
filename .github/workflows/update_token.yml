name: Actualizar token LaLiga

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Token de LaLiga Fantasy'
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Actualizar LALIGA_TOKEN en GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set LALIGA_TOKEN \
            --repo sergiopf93/liga-fantasy \
            --body "${{ github.event.inputs.token }}"
          echo "Token actualizado correctamente"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pyyaml

      - name: Reclamar recompensa diaria
        env:
          LALIGA_TOKEN: ${{ github.event.inputs.token }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python scripts/daily_reward.py || echo "Recompensa no disponible o ya reclamada"

      - name: Regenerar informe con nuevo token
        env:
          LALIGA_TOKEN: ${{ github.event.inputs.token }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python scripts/generate_report.py

      - name: Guardar histórico diario
        env:
          LALIGA_TOKEN: ${{ github.event.inputs.token }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python scripts/save_history.py || echo "Error guardando histórico"

      - name: Commit datos
        run: |
          git config user.name "Fantasy Bot"
          git config user.email "bot@liga-fantasy"
          git add data/
          git diff --staged --quiet || git commit -m "Token renovado - $(date '+%d/%m %H:%M')"
          git push

      - name: Preparar site
        run: |
          mkdir -p _site/data
          cp frontend/index.html _site/index.html
          for f in data/team.json data/market.json data/report.json data/rivals.json data/decisions.json data/reward.json data/analyst_latest.json; do
            [ -f "$f" ] && cp "$f" _site/data/ || echo "No existe: $f"
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
