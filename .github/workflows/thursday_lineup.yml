name: Ajuste alineación jueves 22:00

on:
  schedule:
    - cron: '0 20 * * 4'   # Jueves 22:00 hora España (UTC+2)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Calcular mejor alineación
        env:
          LALIGA_TOKEN: ${{ secrets.LALIGA_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          DRY_RUN: "true"   # cambiar a "false" para ejecutar en real
        run: python scripts/thursday_lineup.py
      - name: Commit
        run: |
          git config user.name "Fantasy Bot"
          git config user.email "bot@liga-fantasy"
          git add data/
          git diff --staged --quiet || git commit -m "Alineación jueves - $(date '+%d/%m %H:%M')"
          git push
      - name: Preparar site
        run: |
          mkdir -p _site/data
          cp frontend/index.html _site/index.html
          cp data/*.json _site/data/ 2>/dev/null || true
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
