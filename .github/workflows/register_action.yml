name: Registrar acción ejecutada

on:
  workflow_dispatch:
    inputs:
      action_data:
        description: 'JSON con datos de la acción ejecutada'
        required: true
        type: string

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Registrar acción
        run: |
          python scripts/register_action.py '${{ github.event.inputs.action_data }}'

      - name: Commit
        run: |
          git config user.name "Fantasy Bot"
          git config user.email "bot@liga-fantasy"
          git add data/activity/
          git diff --staged --quiet || git commit -m "Acción ejecutada registrada - $(date '+%d/%m %H:%M')"
          git push
